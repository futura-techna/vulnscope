version: '3.8'

# Docker Compose optimisé pour Google Cloud e2-micro (1GB RAM)
# Elasticsearch désactivé pour économiser la mémoire
# Contraintes de ressources ajoutées

services:
  # VulnScope API
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - VULNSCOPE_ENVIRONMENT=production
      - VULNSCOPE_DEBUG=false
      - VULNSCOPE_DATABASE__URL=${VULNSCOPE_DATABASE__URL}
      - VULNSCOPE_REDIS__HOST=redis
      - VULNSCOPE_REDIS__PORT=6379
      - VULNSCOPE_REDIS__PASSWORD=${VULNSCOPE_REDIS__PASSWORD}
      - VULNSCOPE_SECRET_KEY=${VULNSCOPE_SECRET_KEY}
      - VULNSCOPE_API_KEY=${VULNSCOPE_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # VulnScope Frontend (Next.js)
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # PostgreSQL Database - Optimisé pour 1GB RAM
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vulnscope}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-vulnscope}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnscope}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "effective_cache_size=192MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "max_connections=50"

  # Redis Cache - Optimisé pour 1GB RAM
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${VULNSCOPE_REDIS__PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${VULNSCOPE_REDIS__PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # MinIO for S3 Storage - Optionnel (peut être désactivé)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-vulnscope}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    profiles:
      - storage  # Activer avec: docker compose --profile storage up

  # Adminer - Database Management UI
  adminer:
    image: adminer:4.8.1
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    profiles:
      - admin  # Activer avec: docker compose --profile admin up

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M

volumes:
  postgres_data:
  redis_data:
  minio_data: