version: '3.8'

services:
  # VulnScope API
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - VULNSCOPE_ENVIRONMENT=production
      - VULNSCOPE_DEBUG=false
      - VULNSCOPE_DATABASE__URL=${VULNSCOPE_DATABASE__URL}
      - VULNSCOPE_REDIS__HOST=redis
      - VULNSCOPE_REDIS__PORT=6379
      - VULNSCOPE_REDIS__PASSWORD=${VULNSCOPE_REDIS__PASSWORD}
      - VULNSCOPE_SECRET_KEY=${VULNSCOPE_SECRET_KEY}
      - VULNSCOPE_API_KEY=${VULNSCOPE_API_KEY}
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 4

  # VulnScope Dashboard (Streamlit)
  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.enableCORS=false

  # PostgreSQL Database
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vulnscope}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-vulnscope}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnscope"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${VULNSCOPE_REDIS__PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # MinIO for S3 Storage (Optional)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  # Elasticsearch for SIEM (Optional)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  # Adminer - Database Management UI
  adminer:
    image: adminer:4.8.1
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - dashboard
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  es_data:
