# ==============================================================================
# VulnScope - Docker Compose for Local Cloud Deployment
# ==============================================================================
# This file is designed for local deployment with Coolify and Cloudflare Tunnel.
#
# Usage:
#   make local-up       - Start all services
#   make local-down     - Stop all services
#   make local-logs     - View logs
#
# Environment variables (from .env file):
#   POSTGRES_PASSWORD   - PostgreSQL password
#   REDIS_PASSWORD      - Redis password
#   VULNSCOPE_SECRET_KEY - Application secret key
#   VULNSCOPE_API_KEY   - API key for authentication
# ==============================================================================

version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: vulnscope-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vulnscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnscope123}
      POSTGRES_DB: vulnscope
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnscope"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnscope-network
    # Only expose internally
    expose:
      - "5432"

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: vulnscope-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnscope-network
    # Only expose internally
    expose:
      - "6379"

  # ============================================================================
  # API Backend (FastAPI)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulnscope-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - VULNSCOPE_SECRET_KEY=${VULNSCOPE_SECRET_KEY:-change-me-in-production}
      - VULNSCOPE_API_KEY=${VULNSCOPE_API_KEY:-change-me-in-production}
      - VULNSCOPE_DATABASE__URL=postgresql://vulnscope:${POSTGRES_PASSWORD:-vulnscope123}@db:5432/vulnscope
      - VULNSCOPE_REDIS__HOST=redis
      - VULNSCOPE_REDIS__PORT=6379
      - VULNSCOPE_REDIS__PASSWORD=${REDIS_PASSWORD:-redis123}
      - VULNSCOPE_ENVIRONMENT=production
      - VULNSCOPE_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vulnscope-network
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.vulnscope-api.rule=Host(`api.local`)"
      - "traefik.http.services.vulnscope-api.loadbalancer.server.port=8000"

  # ============================================================================
  # Frontend (Next.js)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vulnscope-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001/api/v1}
      - API_URL=http://api:8000
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - vulnscope-network
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.vulnscope-frontend.rule=Host(`vulnscope.local`)"
      - "traefik.http.services.vulnscope-frontend.loadbalancer.server.port=3000"

  # ============================================================================
  # Optional: Adminer (Database UI) - Uncomment to enable
  # ============================================================================
  # adminer:
  #   image: adminer:latest
  #   container_name: vulnscope-adminer
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - vulnscope-network
  #   labels:
  #     - "coolify.managed=true"

  # ============================================================================
  # Optional: Redis Commander (Redis UI) - Uncomment to enable
  # ============================================================================
  # redis-commander:
  #   image: rediscommander/redis-commander:latest
  #   container_name: vulnscope-redis-ui
  #   restart: unless-stopped
  #   environment:
  #     - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-redis123}
  #   ports:
  #     - "8081:8081"
  #   networks:
  #     - vulnscope-network
  #   labels:
  #     - "coolify.managed=true"

# ============================================================================
# Networks
# ============================================================================
networks:
  vulnscope-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local